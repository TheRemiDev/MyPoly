# Compile l'application Android MyPoly (APK) à chaque modification du dossier android/
# ou à la demande (onglet Actions → « Application Android » → Run workflow).
#
# Réglages (Settings → Secrets and variables → Actions) :
#   Variable  MYPOLY_URL                 adresse du site, ex. https://jeu.exemple.fr
#   Secret    ANDROID_KEYSTORE_BASE64    clé de signature (fichier .jks encodé en base64)
#   Secrets   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sans clé, l'APK est signé avec une clé de test (les mises à jour devront être réinstallées).
name: Application Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse du site MyPoly (ex. https://jeu.exemple.fr). Vide = variable MYPOLY_URL."
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est préinstallé sur les machines GitHub : on ajoute juste la plateforme utilisée
      - name: SDK Android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "sdkmanager : $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mypoly.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mypoly.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de signature : APK signé avec une clé de test."
          fi

      - name: Compilation
        env:
          MYPOLY_URL: ${{ inputs.server_url || vars.MYPOLY_URL }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MyPoly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyPoly-android
          path: MyPoly.apk
